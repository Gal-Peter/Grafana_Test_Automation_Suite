[pytest]
pythonpath = .
testpaths = tests
addopts = --alluredir=allure-results -ra
log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
markers =
    smoke: quick sanity checks
    regression: full regression suite
    api: pure API tests (no browser)
    unit: pure-Python tests of the framework itself (no Grafana needed)
    mobile: Appium mobile-browser tests (skipped when no Appium server is reachable)
    ai: tests that call an LLM (need ANTHROPIC_API_KEY)
    no_auth: run the browser test WITHOUT the saved login session
